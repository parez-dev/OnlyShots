name: release

# A release is a tag: bump the version (./gradlew bumpVersion), commit, then push `v<version>`.
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match onlyshots.version in gradle.properties. This uploads the signed Android bundle to Play's internal
# testing track, uploads the iOS build to App Store Connect, builds the desktop editor on each OS and publishes a
# GitHub Release with the installers and generated notes. The web editor deploys from main (ci.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag is the app's version
        id: version
        run: |
          version=$(sed -n 's/^onlyshots.version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match onlyshots.version=${version}; tag v${version}, or bump first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: The iOS project carries the same version
        run: ./gradlew checkAppVersion --stacktrace

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Signed release bundle
        env:
          ONLYSHOTS_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ONLYSHOTS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONLYSHOTS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONLYSHOTS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:bundleRelease --stacktrace
      # Play's API takes no bundle for an app that never had one: the first is uploaded by hand from this artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/androidApp/build/outputs/bundle/release/androidApp-release.aab
            app/androidApp/build/outputs/mapping/release/mapping.txt
      - name: Upload to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.parez.onlyshots
          releaseFiles: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: app/androidApp/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ needs.check.outputs.version }}
          track: internal
          status: completed

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      # xcodebuild signs and uploads as the App Store Connect API key, so nothing here needs a certificate in a
      # keychain: -allowProvisioningUpdates makes the distribution certificate and the App Store profile itself the
      # first time. The key lives where xcodebuild looks for it by name.
      - name: App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "${{ secrets.APPSTORE_API_ISSUER_ID }}" ] \
             || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::Set APPSTORE_API_KEY_P8, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID and APPLE_TEAM_ID."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
      - name: Generate the Xcode project
        working-directory: app/iosApp
        run: xcodegen generate
      # The target's pre-build phase builds the Kotlin module through Swift export, so this archive runs Gradle too.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          xcodebuild archive \
            -project app/iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OnlyShots.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic
      - name: Export the archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OnlyShots.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"
      # As the Android job does: keep the artifact, so a failed upload does not mean a rebuild, and so the very first
      # one can go up by hand if App Store Connect has no app record yet.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          xcrun altool --upload-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "${{ secrets.APPSTORE_API_ISSUER_ID }}"

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: dmg
          - os: windows-latest
            format: msi
          - os: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Each OS packages its own installer, with that OS's FFmpeg natives (desktopNatives in video/build.gradle.kts).
      - name: Package the desktop editor
        run: ./gradlew :app:desktopApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}
          path: app/desktopApp/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  publish:
    needs: [check, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "OnlyShots ${{ needs.check.outputs.version }}" \
            --generate-notes \
            --verify-tag
